
<style>
/* CHUKHRAY — EDITORIAL WAVY FRAMES */

:root {
  --wave-ink: #5a3b30;
  --wave-paper: #fffdfa;
}

/* Головне фото — органічна форма */
.hero-image {
  padding: 18px 12px 28px 24px;
  isolation: isolate;
}

.hero-image::before {
  z-index: -1;
  inset: 0 15% 12% 0;
  width: auto;
  height: auto;
  background: #ead7d2;
  border: 1px solid var(--wave-ink);
  border-radius: 46% 54% 12% 18% / 15% 12% 20% 16%;
  transform: rotate(-3deg);
}

.hero-image img {
  border: 1px solid var(--wave-ink);
  border-radius: 48% 52% 9% 11% / 13% 10% 12% 9%;
  outline: 1px solid rgba(90, 59, 48, .4);
  outline-offset: 5px;
  transition: border-radius .5s ease, transform .5s ease;
}

.hero-image:hover img {
  border-radius: 12% 8% 44% 10% / 8% 10% 14% 12%;
}

.image-note {
  right: -4px;
  bottom: 4px;
  border: 1px solid var(--wave-ink);
  border-radius: 45% 55% 8% 12% / 15% 10% 12% 10%;
  box-shadow: 4px 4px 0 var(--cream);
  transform: rotate(-3deg);
}

/* Послуги — асиметричні рамки */
.service {
  position: relative;
  border: 0;
  outline: 1px solid #d8c7bc;
  outline-offset: -1px;
  padding: 30px;
  transition: background .3s ease, transform .3s ease;
}

.service:nth-child(odd) {
  border-radius: 28px 3px 32px 3px;
}

.service:nth-child(even) {
  border-radius: 3px 28px 3px 32px;
}

.service:nth-child(odd)::before,
.service:nth-child(even)::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(90, 59, 48, .22);
  border-radius: inherit;
  pointer-events: none;
}

.service:hover {
  background: #f8f0e9;
  transform: translateY(-3px);
}

.service h3 {
  font-size: clamp(25px, 3vw, 32px);
}

.details {
  position: relative;
}

/* Фото «Про мене» — подвійна рамка */
.about img {
  padding: 7px;
  border: 1px solid var(--wave-ink);
  border-radius: 8% 42% 8% 38% / 10% 12% 9% 15%;
  outline: 1px solid #cbb6a8;
  outline-offset: 5px;
  transition: border-radius .5s ease;
}

.about img:hover {
  border-radius: 40% 8% 38% 8% / 12% 10% 15% 9%;
}

/* Умови зйомки — делікатні акценти */
.conditions details {
  position: relative;
  border-color: #d5c2b6;
}

.conditions summary {
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.conditions summary::-webkit-details-marker {
  display: none;
}

.conditions summary::after {
  content: "↗";
  font-size: 17px;
  color: var(--wave-ink);
  transition: transform .3s ease;
}

.conditions details[open] summary::after {
  transform: rotate(45deg);
}

/* Шоколадні деталі */
.button {
  border-radius: 2px 14px 2px 14px;
  transition: .3s ease;
}

.button:hover {
  border-radius: 14px 2px 14px 2px;
}

/* Акуратна адаптація для телефона */
@media (max-width: 700px) {
  .hero-image {
    padding: 14px 10px 25px 15px;
    margin: 0 4px;
  }

  .hero-image img {
    height: 380px;
  }

  .image-note {
    right: -2px;
    padding: 13px 16px;
    font-size: 21px;
  }

  .service {
    padding: 25px 22px;
  }

  .service:nth-child(odd) {
    border-radius: 23px 3px 25px 3px;
  }

  .service:nth-child(even) {
    border-radius: 3px 23px 3px 25px;
  }

  .about img {
    height: 350px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .hero-image img,
  .about img,
  .service,
  .button {
    transition: none;
  }
}
</style>
</body>
</html>
